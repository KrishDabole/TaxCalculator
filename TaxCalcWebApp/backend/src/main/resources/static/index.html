<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Tax Calculator</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body { font-family: Arial, sans-serif; max-width:800px;margin:40px auto; padding:20px; }
    label,input { display:block; margin:10px 0; }
    button { padding:10px 20px; }
    #result { margin-top:20px; font-weight:bold; }
  </style>
</head>
<body>
  <h1>Tax Calculator (Frontend)</h1>
  <div>
    <label>Income: <input id="income" type="number" value="500000"></label>
    <label>Deductions: <input id="deductions" type="number" value="50000"></label>
    <button id="calc">Calculate Tax</button>
    <div id="result"></div>
  </div>

  <script>
    const apiBase = '/api';
    document.getElementById('calc').addEventListener('click', async () => {
      const income = Number(document.getElementById('income').value || 0);
      const deductions = Number(document.getElementById('deductions').value || 0);
      try {
        const resp = await fetch(apiBase + '/tax/calculate', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({income, deductions})
        });
        if (!resp.ok) {
          const txt = await resp.text();
          document.getElementById('result').textContent = 'Error: ' + resp.status + ' ' + txt;
          return;
        }
        const data = await resp.json();
        document.getElementById('result').textContent = 'Tax: ' + data.tax + ' | Net Income: ' + data.netIncome;
      } catch (e) {
        document.getElementById('result').textContent = 'Fetch error: ' + e;
      }
    });
  </script>
</body>
</html>
